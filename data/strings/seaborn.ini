# Seaborn
#
# A constructed-script language for this private build.
#
# Only the display name lives here on purpose: Strings::loadLanguage() always
# loads en.ini as the base before overlaying the selected language, so every
# other string falls through to English automatically. Copying the whole file
# would just make a snapshot that goes stale.
#
# The script comes from the font, not from the strings: selecting this language
# renders the UI with data/mods/fonts/AgeFonts001.ttf. See docs/MODDING_NOTES.md.

[_]
display_name = Seaborn 海嗣文（Ægir）
